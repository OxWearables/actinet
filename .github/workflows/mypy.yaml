name: Type check

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    name: Mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Install project and mypy
        run: python -m pip install --editable . mypy==1.14.1

      - name: Run mypy
        run: python -m mypy
