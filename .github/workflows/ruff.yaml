name: ruff

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Install Ruff
        run: python -m pip install ruff==0.15.20

      - name: Check for syntax errors and undefined names
        run: ruff check . --select=E9,F63,F7,F82

      - name: Report additional lint findings
        if: always()
        continue-on-error: true
        run: ruff check . --output-format=github
